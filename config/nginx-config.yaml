apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default   # ← make sure namespace matches!
data:
  default.conf: |       # ← nginx alpine image loads /etc/nginx/conf.d/*.conf
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # 1. Static assets (fix regex)
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff2?|ttf|svg|eot|otf)$ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 2. PMTiles files - important for range requests
        location ~* \.pmtiles$ {
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, immutable";
            expires 1y;
        }

        # 3. Fonts and sprites (also needed for range requests if using pbf fonts)
        location ~* \.(pbf|json)$ {
            add_header Accept-Ranges bytes;
            expires 1y;
        }

        # 4. Proxy to tileserver-gl
        location /tileserver/ {
            proxy_pass http://tileserver-gl:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Proxy to Martin
        location /martin/ {
            proxy_pass http://martin:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. Proxy to routing API
        location /api/ {
            proxy_pass http://routing-api:5000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # 8. SPA fallback - must be last
        location / {
            try_files $uri /index.html;
        }
    }