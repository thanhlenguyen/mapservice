<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSA Route & Crime Analysis</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>

    <script src='https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css' rel='stylesheet' />

    <style>
        body { margin:0; overflow:hidden; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        .marker { 
            background:#10b981; 
            color:white; 
            width:36px; 
            height:36px; 
            border-radius:50%; 
            display:flex; 
            align-items:center; 
            justify-content:center; 
            font-weight:bold; 
            box-shadow:0 4px 10px rgba(0,0,0,0.3); 
        }
        .marker-end { background:#ef4444; }
        .marker-crime { background:#dc2626; font-size:18px; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Header with Mode Switcher -->
<div class="fixed top-4 left-1/2 -translate-x-1/2 z-10 bg-white px-6 py-4 rounded-2xl shadow-2xl border border-blue-100">
    <div class="flex items-center gap-4">
        <h1 class="text-xl font-bold text-gray-800">KSA Analysis Tool</h1>
        <div class="flex bg-gray-100 rounded-lg p-1">
            <button id="mode-route" class="px-3 py-2 text-xs font-medium rounded-md bg-blue-600 text-white transition">
                🗺️ A→B Route
            </button>
            <button id="mode-tsp" class="px-3 py-2 text-xs font-medium rounded-md hover:bg-gray-200 transition">
                🔄 TSP Multi
            </button>
            <button id="mode-crime" class="px-3 py-2 text-xs font-medium rounded-md hover:bg-gray-200 transition">
                🚨 Escape
            </button>
        </div>
    </div>
    <p class="text-sm text-gray-600 mt-2" id="mode-instruction">
        Click: <span class="text-green-600 font-bold">Start</span> → <span class="text-red-600 font-bold">End</span>
    </p>
</div>

<!-- Time Slider (only visible in crime mode) -->
<div id="time-slider" class="fixed top-28 left-1/2 -translate-x-1/2 z-10 bg-white px-6 py-3 rounded-xl shadow-xl border border-gray-200 hidden">
    <label class="text-sm font-semibold text-gray-700">Escape Time: <span id="time-value">5</span> min</label>
    <input type="range" id="time-input" min="1" max="15" value="5" step="1" 
           class="w-64 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2">
</div>

<!-- Info Box -->
<div id="info-box" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-10 bg-white px-6 py-4 rounded-xl shadow-2xl border border-gray-200 text-center hidden">
    <p class="text-base text-gray-800" id="route-info">Click to start</p>
</div>

<script>
    const STYLES = [
        { id: 'basic', name: 'Default', url: 'http://localhost:8080/styles/basic-style/style.json', pitch: 0, zoom: 12 },
        { id: 'sat', name: 'Satellite', url: 'http://localhost:8080/styles/sat-style/style.json', pitch: 0, zoom: 12 },
        { id: '3d', name: '3D', url: 'http://localhost:8080/styles/3d-style/style.json', pitch: 45, zoom: 14 }
    ];

    let currentCenter = [46.6167, 24.8258]; // Riyadh
    let currentZoom = 12;
    let currentPitch = 0;
    let currentBearing = 0;

    let map;
    let currentMode = 'route'; // 'route', 'tsp', or 'crime'
    let startMarker = null;
    let endMarker = null;
    let crimeMarker = null;
    let tspMarkers = []; // Array of waypoint markers for TSP
    let currentRouteData = null;
    let escapeMinutes = 5;

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: STYLES[0].url,
            center: currentCenter,
            zoom: currentZoom,
            pitch: currentPitch,
            bearing: currentBearing,
            maxPitch: 85
        });

        map.on('moveend', () => {
            currentCenter = map.getCenter();
            currentZoom = map.getZoom();
            currentPitch = map.getPitch();
            currentBearing = map.getBearing();
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(createLayerSwitcher(), 'bottom-right');

        // Map click handler
        map.on('click', (e) => {
            if (currentMode === 'route') {
                handleRouteClick(e.lngLat);
            } else if (currentMode === 'tsp') {
                handleTSPClick(e.lngLat);
            } else {
                handleCrimeClick(e.lngLat);
            }
        });

        // Mode switcher buttons
        document.getElementById('mode-route').onclick = () => switchMode('route');
        document.getElementById('mode-tsp').onclick = () => switchMode('tsp');
        document.getElementById('mode-crime').onclick = () => switchMode('crime');

        // Time slider
        document.getElementById('time-input').oninput = (e) => {
            escapeMinutes = parseInt(e.target.value);
            document.getElementById('time-value').textContent = escapeMinutes;
            
            // Recalculate if crime point exists
            if (crimeMarker) {
                calculateEscapeArea(crimeMarker.getLngLat());
            }
        };

        map.on('load', () => showInfo("Click anywhere to set start point"));
    }

    function switchMode(mode) {
        currentMode = mode;
        clearAll();

        // Update UI
        const routeBtn = document.getElementById('mode-route');
        const tspBtn = document.getElementById('mode-tsp');
        const crimeBtn = document.getElementById('mode-crime');
        const timeSlider = document.getElementById('time-slider');
        const instruction = document.getElementById('mode-instruction');

        // Reset all buttons
        routeBtn.className = 'px-3 py-2 text-xs font-medium rounded-md hover:bg-gray-200 transition';
        tspBtn.className = 'px-3 py-2 text-xs font-medium rounded-md hover:bg-gray-200 transition';
        crimeBtn.className = 'px-3 py-2 text-xs font-medium rounded-md hover:bg-gray-200 transition';

        if (mode === 'route') {
            routeBtn.className = 'px-3 py-2 text-xs font-medium rounded-md bg-blue-600 text-white transition';
            timeSlider.classList.add('hidden');
            instruction.innerHTML = 'Click: <span class="text-green-600 font-bold">Start</span> → <span class="text-red-600 font-bold">End</span>';
            showInfo("🗺️ A→B Route: Click start point");
        } else if (mode === 'tsp') {
            tspBtn.className = 'px-3 py-2 text-xs font-medium rounded-md bg-purple-600 text-white transition';
            timeSlider.classList.add('hidden');
            instruction.innerHTML = 'Click: <span class="text-purple-600 font-bold">Add waypoints</span> (min 3 points, then wait)';
            showInfo("🔄 TSP Mode: Click to add waypoints (3+ points)");
        } else {
            crimeBtn.className = 'px-3 py-2 text-xs font-medium rounded-md bg-red-600 text-white transition';
            timeSlider.classList.remove('hidden');
            instruction.innerHTML = 'Click: <span class="text-red-600 font-bold">Crime Location</span> (adjust time slider)';
            showInfo("🚨 Crime mode: Click crime location");
        }
    }

    function handleRouteClick(lngLat) {
        if (!startMarker) {
            startMarker = new maplibregl.Marker({ element: createMarker('S', '#10b981') })
                .setLngLat(lngLat)
                .addTo(map);
            showInfo("✅ Start set. Click destination");
        } else if (!endMarker) {
            endMarker = new maplibregl.Marker({ element: createMarker('E', '#ef4444') })
                .setLngLat(lngLat)
                .addTo(map);
            calculateRoute(startMarker.getLngLat(), endMarker.getLngLat());
        } else {
            clearAll();
            showInfo("🔄 Cleared. Click new start point");
        }
    }

    function handleTSPClick(lngLat) {
        // Add waypoint marker
        const markerNum = tspMarkers.length + 1;
        const marker = new maplibregl.Marker({ 
            element: createMarker(markerNum.toString(), '#9333ea') 
        })
            .setLngLat(lngLat)
            .addTo(map);
        
        tspMarkers.push({ marker, lngLat });
        
        if (tspMarkers.length < 3) {
            showInfo(`✅ Point ${markerNum} added. Need ${3 - tspMarkers.length} more (min 3 points)`);
        } else {
            showInfo(`✅ Point ${markerNum} added. Auto-calculating TSP in 2 seconds...`);
            
            // Auto-calculate after 2 seconds
            setTimeout(() => {
                if (tspMarkers.length >= 3) {
                    calculateTSP();
                }
            }, 2000);
        }
    }

    function calculateTSP() {
        if (tspMarkers.length < 2) {
            showInfo("❌ Need at least 2 points for TSP");
            return;
        }

        showInfo(`⏳ Solving TSP for ${tspMarkers.length} points...`);

        const points = tspMarkers.map(m => [m.lngLat.lng, m.lngLat.lat]);

        fetch('/api/route', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ points })
        })
            .then(async r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showInfo("❌ " + data.error);
                    return;
                }

                currentRouteData = data;

                // Remove old route
                ['route'].forEach(id => {
                    if (map.getLayer(id)) map.removeLayer(id);
                    if (map.getSource(id)) map.removeSource(id);
                });

                // Add optimized route
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: {
                        'line-color': '#9333ea',
                        'line-width': 7,
                        'line-opacity': 0.9
                    }
                });

                // Fit bounds
                const bounds = new maplibregl.LngLatBounds();
                data.features.forEach(f => {
                    if (f.geometry?.coordinates) {
                        f.geometry.coordinates.forEach(coord => bounds.extend(coord));
                    }
                });
                map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 1500 });

                // Show order
                const orderStr = data.waypoint_order.map(i => i + 1).join(' → ');
                showInfo(`
                    ✅ <strong>TSP Optimized!</strong><br>
                    Order: ${orderStr}<br>
                    ${data.duration_minutes} min • ${data.total_distance_km} km
                `);
            })
            .catch(err => {
                showInfo("❌ Error: " + err.message);
                console.error(err);
            });
        }
        function handleCrimeClick(lngLat) {
        if (crimeMarker) {
            crimeMarker.remove();
        }
        crimeMarker = new maplibregl.Marker({ element: createMarker('🚨', '#dc2626') })
            .setLngLat(lngLat)
            .addTo(map);
        
        calculateEscapeArea(lngLat);
    }

    function createMarker(text, bgColor) {
        const el = document.createElement('div');
        el.className = 'marker';
        if (text === '🚨') el.className += ' marker-crime';
        el.style.backgroundColor = bgColor;
        el.textContent = text;
        return el;
    }

    function showInfo(text) {
        document.getElementById('info-box').classList.remove('hidden');
        document.getElementById('route-info').innerHTML = text;
    }

    function calculateRoute(start, end) {
        showInfo("⏳ Calculating route...");

        fetch(`/api/route?start_lon=${start.lng}&start_lat=${start.lat}&end_lon=${end.lng}&end_lat=${end.lat}`)
            .then(async r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showInfo("❌ " + data.error);
                    return;
                }

                currentRouteData = data;

                // Remove old layers
                ['route'].forEach(id => {
                    if (map.getLayer(id)) map.removeLayer(id);
                    if (map.getSource(id)) map.removeSource(id);
                });

                // Add route
                map.addSource('route', { type: 'geojson', data: data });
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: {
                        'line-color': '#3b82f6',
                        'line-width': 7,
                        'line-opacity': 0.9
                    }
                });

                // Fit bounds
                const bounds = new maplibregl.LngLatBounds();
                data.features.forEach(f => {
                    if (f.geometry?.coordinates) {
                        f.geometry.coordinates.forEach(coord => bounds.extend(coord));
                    }
                });
                map.fitBounds(bounds, { padding: 80, maxZoom: 15, duration: 1500 });

                showInfo(`✅ Route: ${data.duration_minutes} min • ${data.total_distance_km} km`);
            })
            .catch(err => {
                showInfo("❌ Error: " + err.message);
                console.error(err);
            });
    }

    function calculateEscapeArea(lngLat) {
        showInfo(`⏳ Calculating ${escapeMinutes}-min escape area...`);

        fetch(`/api/escape_area?lon=${lngLat.lng}&lat=${lngLat.lat}&minutes=${escapeMinutes}`)
            .then(async r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showInfo("❌ " + data.error);
                    return;
                }

                // Remove old layers
                ['escape-network', 'escape-hull', 'escape-border'].forEach(id => {
                    if (map.getLayer(id)) map.removeLayer(id);
                    if (map.getSource(id)) map.removeSource(id);
                });

                // Add reachable network
                map.addSource('escape-network', { 
                    type: 'geojson', 
                    data: data.reachable_network 
                });
                map.addLayer({
                    id: 'escape-network',
                    type: 'line',
                    source: 'escape-network',
                    paint: {
                        'line-color': '#f59e0b',
                        'line-width': 3,
                        'line-opacity': 0.6
                    }
                });

                // Add escape area hull
                map.addSource('escape-hull', { 
                    type: 'geojson', 
                    data: data.escape_area 
                });
                map.addLayer({
                    id: 'escape-hull',
                    type: 'fill',
                    source: 'escape-hull',
                    paint: {
                        'fill-color': '#dc2626',
                        'fill-opacity': 0.15
                    }
                });
                map.addLayer({
                    id: 'escape-border',
                    type: 'line',
                    source: 'escape-hull',
                    paint: {
                        'line-color': '#dc2626',
                        'line-width': 4,
                        'line-dasharray': [3, 2],
                        'line-opacity': 0.8
                    }
                });

                // Fit to escape area
                const bounds = new maplibregl.LngLatBounds();
                if (data.escape_area.coordinates?.[0]) {
                    data.escape_area.coordinates[0].forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds, { padding: 100, maxZoom: 14, duration: 1500 });
                }

                showInfo(`🚨 ${escapeMinutes}-min escape area calculated<br><small>Red zone = reachable area from crime point</small>`);
            })
            .catch(err => {
                showInfo("❌ Error: " + err.message);
                console.error(err);
            });
    }

    function clearAll() {
        // Remove all layers
        ['route', 'escape-network', 'escape-hull', 'escape-border'].forEach(id => {
            if (map.getLayer(id)) map.removeLayer(id);
            if (map.getSource(id)) map.removeSource(id);
        });

        // Remove markers
        if (startMarker) { startMarker.remove(); startMarker = null; }
        if (endMarker) { endMarker.remove(); endMarker = null; }
        if (crimeMarker) { crimeMarker.remove(); crimeMarker = null; }
        
        // Remove TSP markers
        tspMarkers.forEach(m => m.marker.remove());
        tspMarkers = [];
        
        currentRouteData = null;
    }

    function createLayerSwitcher() {
        class LayerSwitcher {
            onAdd(map) {
                this.map = map;
                this.container = document.createElement('div');
                this.container.className = 'maplibregl-ctrl maplibregl-ctrl-group flex flex-col bg-white';

                STYLES.forEach(style => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'px-4 py-3 text-sm font-medium hover:bg-blue-50 border-b border-gray-200 transition';
                    btn.textContent = style.name;
                    btn.onclick = () => {
                        map.setStyle(style.url);
                        map.once('styledata', () => {
                            // Restore layers after style change
                            if (currentMode === 'route' && currentRouteData) {
                                map.addSource('route', { type: 'geojson', data: currentRouteData });
                                map.addLayer({
                                    id: 'route',
                                    type: 'line',
                                    source: 'route',
                                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                                    paint: { 'line-color': '#3b82f6', 'line-width': 7, 'line-opacity': 0.9 }
                                });
                            }
                            map.easeTo({ pitch: style.pitch, zoom: style.zoom || currentZoom, duration: 1000 });
                        });
                    };
                    this.container.appendChild(btn);
                });
                return this.container;
            }
            onRemove() { 
                this.container.parentNode.removeChild(this.container); 
            }
        }
        return new LayerSwitcher();
    }

    window.onload = initMap;
</script>

</body>
</html>
