<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSA Route Planner with Area of Interest</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>

    <script src='https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css' rel='stylesheet' />

    <style>
        body { margin:0; overflow:hidden; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
        .marker { 
            background:#10b981; 
            color:white; 
            width:36px; 
            height:36px; 
            border-radius:50%; 
            display:flex; 
            align-items:center; 
            justify-content:center; 
            font-weight:bold; 
            box-shadow:0 4px 10px rgba(0,0,0,0.3); 
        }
        .marker-end { background:#ef4444; }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Header -->
<div class="fixed top-4 left-1/2 -translate-x-1/2 z-10 bg-white px-6 py-4 rounded-2xl shadow-2xl border border-blue-100 text-center">
    <h1 class="text-2xl font-bold text-gray-800">🗺️ Route + Area of Interest</h1>
    <p class="text-sm text-gray-600 mt-1">Click: <span class="text-green-600 font-bold">Start</span> → <span class="text-red-600 font-bold">End</span></p>
</div>

<!-- Info Box -->
<div id="info-box" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-10 bg-white px-6 py-4 rounded-xl shadow-2xl border border-gray-200 text-center hidden">
    <p class="text-base text-gray-800" id="route-info">Click to set start point</p>
</div>

<script>
    const STYLES = [
        { id: 'basic', name: 'Default', url: 'http://localhost:8080/styles/basic-style/style.json', pitch: 0, zoom: 12 },
        { id: 'sat', name: 'Satellite', url: 'http://localhost:8080/styles/sat-style/style.json', pitch: 0, zoom: 12 },
        { id: '3d', name: '3D', url: 'http://localhost:8080/styles/3d-style/style.json', pitch: 45, zoom: 14 }
    ];

    let currentCenter = [46.6167, 24.8258]; // Riyadh
    let currentZoom = 12;
    let currentPitch = 0;
    let currentBearing = 0;

    let map;
    let startMarker = null;
    let endMarker = null;
    let currentRouteData = null;
    let currentAOI = null; // Store AOI separately

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: STYLES[0].url,
            center: currentCenter,
            zoom: currentZoom,
            pitch: currentPitch,
            bearing: currentBearing,
            maxPitch: 85
        });

        map.on('moveend', () => {
            currentCenter = map.getCenter();
            currentZoom = map.getZoom();
            currentPitch = map.getPitch();
            currentBearing = map.getBearing();
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(createLayerSwitcher(), 'bottom-right');

        map.on('click', (e) => {
            const lngLat = e.lngLat;

            if (!startMarker) {
                startMarker = new maplibregl.Marker({ element: createMarker('S', '#10b981') })
                    .setLngLat(lngLat)
                    .addTo(map);
                showInfo("✅ Start set. Now click destination");
            } else if (!endMarker) {
                endMarker = new maplibregl.Marker({ element: createMarker('E', '#ef4444') })
                    .setLngLat(lngLat)
                    .addTo(map);
                calculateRoute(startMarker.getLngLat(), endMarker.getLngLat());
            } else {
                clearRoute();
                startMarker = null;
                endMarker = null;
                showInfo("🔄 Cleared. Click to set new start point");
            }
        });

        map.on('load', () => showInfo("👆 Click anywhere to set start point"));
    }

    function createMarker(text, bgColor) {
        const el = document.createElement('div');
        el.className = 'marker';
        el.style.backgroundColor = bgColor;
        el.textContent = text;
        return el;
    }

    function showInfo(text) {
        const box = document.getElementById('info-box');
        const info = document.getElementById('route-info');
        box.classList.remove('hidden');
        info.innerHTML = text;
    }

    function calculateRoute(start, end) {
        showInfo("⏳ Calculating route & area of interest...");

        fetch(`/api/route_hull?start_lon=${start.lng}&start_lat=${start.lat}&end_lon=${end.lng}&end_lat=${end.lat}`)
            .then(async r => {
                if (!r.ok) {
                    const text = await r.text();
                    throw new Error(`HTTP ${r.status}: ${text}`);
                }
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    showInfo(`❌ ${data.error}`);
                    console.error("Routing error:", data);
                    return;
                }

                // Store for style switching
                currentRouteData = data.route;
                currentAOI = data.area_of_interest;

                // Remove old layers
                ['route', 'aoi-fill', 'aoi-border'].forEach(id => {
                    if (map.getLayer(id)) map.removeLayer(id);
                    if (map.getSource(id)) map.removeSource(id);
                });

                // 1. Add Area of Interest (FIRST, so route is on top)
                map.addSource('aoi-fill', { 
                    type: 'geojson', 
                    data: currentAOI 
                });
                
                map.addLayer({
                    id: 'aoi-fill',
                    type: 'fill',
                    source: 'aoi-fill',
                    paint: {
                        'fill-color': '#10b981',
                        'fill-opacity': 0.15
                    }
                });
                
                map.addLayer({
                    id: 'aoi-border',
                    type: 'line',
                    source: 'aoi-fill',
                    paint: {
                        'line-color': '#059669',
                        'line-width': 3,
                        'line-dasharray': [4, 2],
                        'line-opacity': 0.8
                    }
                });

                // 2. Add Route (on top of AOI)
                map.addSource('route', { 
                    type: 'geojson', 
                    data: currentRouteData 
                });
                
                map.addLayer({
                    id: 'route',
                    type: 'line',
                    source: 'route',
                    layout: { 
                        'line-join': 'round', 
                        'line-cap': 'round' 
                    },
                    paint: {
                        'line-color': '#2563eb',
                        'line-width': 6,
                        'line-opacity': 0.95
                    }
                });

                // Zoom to AOI bounds
                const bounds = new maplibregl.LngLatBounds();
                if (currentAOI.coordinates && currentAOI.coordinates[0]) {
                    currentAOI.coordinates[0].forEach(coord => bounds.extend(coord));
                    map.fitBounds(bounds, { padding: 100, maxZoom: 15, duration: 1500 });
                }

                // Show result
                showInfo(`
                    ✅ <strong>Route Complete</strong><br>
                    🕐 ${data.duration_minutes} min • 
                    📏 ${data.total_distance_km} km • 
                    🧩 ${data.segment_count} segments
                `);
            })
            .catch(err => {
                showInfo(`❌ Error: ${err.message}`);
                console.error("Fetch error:", err);
            });
    }

    function clearRoute() {
        ['route', 'aoi-fill', 'aoi-border'].forEach(id => {
            if (map.getLayer(id)) map.removeLayer(id);
            if (map.getSource(id)) map.removeSource(id);
        });
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();
        currentRouteData = null;
        currentAOI = null;
    }

    // Layer Switcher with proper restoration
    function createLayerSwitcher() {
        class LayerSwitcher {
            onAdd(map) {
                this.map = map;
                this.container = document.createElement('div');
                this.container.className = 'maplibregl-ctrl maplibregl-ctrl-group flex flex-col bg-white';

                STYLES.forEach(style => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'px-4 py-3 text-sm font-medium hover:bg-blue-50 border-b border-gray-200 transition';
                    btn.textContent = style.name;
                    btn.onclick = () => {
                        map.setStyle(style.url);

                        map.once('styledata', () => {
                            // Restore route and AOI after style change
                            if (currentRouteData && currentAOI) {
                                // Remove if exists
                                ['route', 'aoi-fill', 'aoi-border'].forEach(id => {
                                    if (map.getLayer(id)) map.removeLayer(id);
                                    if (map.getSource(id)) map.removeSource(id);
                                });

                                // Re-add AOI
                                map.addSource('aoi-fill', { type: 'geojson', data: currentAOI });
                                map.addLayer({
                                    id: 'aoi-fill',
                                    type: 'fill',
                                    source: 'aoi-fill',
                                    paint: { 'fill-color': '#10b981', 'fill-opacity': 0.15 }
                                });
                                map.addLayer({
                                    id: 'aoi-border',
                                    type: 'line',
                                    source: 'aoi-fill',
                                    paint: {
                                        'line-color': '#059669',
                                        'line-width': 3,
                                        'line-dasharray': [4, 2],
                                        'line-opacity': 0.8
                                    }
                                });

                                // Re-add Route
                                map.addSource('route', { type: 'geojson', data: currentRouteData });
                                map.addLayer({
                                    id: 'route',
                                    type: 'line',
                                    source: 'route',
                                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                                    paint: {
                                        'line-color': '#2563eb',
                                        'line-width': 6,
                                        'line-opacity': 0.95
                                    }
                                });
                            }

                            map.easeTo({ 
                                pitch: style.pitch, 
                                zoom: style.zoom || currentZoom,
                                duration: 1000
                            });
                        });
                    };
                    this.container.appendChild(btn);
                });
                return this.container;
            }
            onRemove() { 
                this.container.parentNode.removeChild(this.container); 
            }
        }
        return new LayerSwitcher();
    }

    window.onload = initMap;
</script>

</body>
</html>
