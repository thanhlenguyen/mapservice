server {
    listen 80;
    server_name localhost;

    # Root for static files
    root /usr/share/nginx/html;
    index index.html;

    # 1. Serve static assets directly (CSS, JS, images, etc.)
    location ~ \.(css|js|png|jpg|jpeg|gif|ico||woff2?|ttf|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. SPA fallback: All other requests → index.html
    location / {
        try_files $uri /index.html;
    }

    # 3. Proxy to tileserver-gl
    location /tiles/ {
        proxy_pass http://tileserver-gl:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Proxy to Martin (fix service name)
    location /martin/ {
        proxy_pass http://martin:3000/;  # ← Changed from martin_server
        proxy_set_header Host $host;
    }

    # 5. Proxy to your routing API
    location /api/ {
        proxy_pass http://routing-api:5000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

        # Handle OPTIONS preflight
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}