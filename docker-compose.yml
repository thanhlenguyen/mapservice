# dockerversion: '3.9'

services:
  postgis:
    image: pgrouting/pgrouting:16-3.5-3.8               # PostGIS with pgRouting       
    container_name: postgis_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vsol:/var/lib/postgresql/data
      - ./data:/data                     # for CSV import later
    shm_size: 1g  # ← ADD THIS LINE (1GB shared memory)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest   # official image
    container_name: martin_server
    restart: unless-stopped
    env_file:
      - .env                                 # expose DB vars to Martin
    ports:
      - "3000:3000"
    volumes:
      - ./config/martin-config.yml:/config.yml:ro # Martin config file (Martin reads martin-config.yml as config.yml)
      - ./data/mbtiles:/mbtiles:ro # MBTiles files (for Martin to serve when we use Martin to render Mbtiles)
      - ./data/pmtiles:/pmtiles:ro # PMTiles files (for Martin to serve when we use Martin to render PMTiles)
      - ./styles/martin:/styles:ro  # Mapbox style JSON files (for Martin to serve when we use Martin to render Mbtiles)
    depends_on:
      postgis:
        condition: service_healthy
    command: --config /config.yml

  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    container_name: tileserver_gl
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.json:/tileserver/config.json:ro       # config.json 
      - ./styles/tileserver:/tileserver/styles:ro # styles for Tileserver-GL       
      - ./data/fonts:/tileserver/fonts:ro      # Raw .ttf/.otf files for Martin to generate glyphs
      - ./data/sprites:/tileserver/sprites:ro  # Individual SVG/PNG files for Martin to generate sprites     
      - ./data/mbtiles:/data/mbtiles:ro  # mbtiles files 
    command: --config /tileserver/config.json --verbose

  # go-pmtiles:
  #   image: protomaps/go-pmtiles:latest   # official image, very small & fast
  #   container_name: go_pmtiles
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"                      # map host:9000 → container:8080
  #   volumes:
  #     - ./data/pmtiles/address_layer.pmtiles:/data.pmtiles:ro          # mount your pmtiles folder read-only
  #   command: serve /data.pmtiles --port=8080 --cache-size=512

  routing-api:
    image: python:3.12-slim
    container_name: routing-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"  # Expose if direct access; else proxy via Nginx
    volumes:
      - ./routing-api:/app  # Create this folder
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    depends_on:
      postgis:
        condition: service_healthy
        
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: always
    env_file: 
      - .env    
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgis
  
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./data/pmtiles:/usr/share/nginx/html/pmtiles:ro # serve PMTiles files when using PMTiles directly in frontend (serverless method)
      - ./data/sprites:/usr/share/nginx/html/sprites:ro   # serve sprites
      - ./data/fonts:/usr/share/nginx/html/fonts:ro       # serve fonts  
      - ./styles:/usr/share/nginx/html/styles:ro    # serve styles
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - martin
      - tileserver-gl    
      - routing-api

volumes:
  vsol: # name of the volume in docker