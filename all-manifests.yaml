# ============================================================================
# K3s Map Service - Complete Manifest
# No Nginx - Direct Ingress Routing
# ============================================================================
# Deployment Strategy:
# 1. Scenario 1: Tileserver (MBTiles) + Martin (PostGIS Dynamic) + Frontend
# 2. Scenario 2: Martin only (MBTiles + PMTiles + PostGIS) + Frontend
# 3. Scenario 3: Frontend with PMTiles direct + Martin (PostGIS only)
# ============================================================================

# ============================================================================
# SECTION 1: NAMESPACE AND CONFIGURATION
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: map-service

---
# ============================================================================
# Environment Variables ConfigMap
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: map-env-config
  namespace: map-service
data:
  POSTGRES_DB: "geodb"
  POSTGRES_USER: "le"
  POSTGRES_HOST: "postgis-service"
  POSTGRES_PORT: "5432"
  PGADMIN_DEFAULT_EMAIL: "admin@admin.com"

---
# ============================================================================
# Secrets
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: map-secrets
  namespace: map-service
type: Opaque
stringData:
  POSTGRES_PASSWORD: "123456"  # Change in production
  PGADMIN_DEFAULT_PASSWORD: "admin"  # Change in production

---
# ============================================================================
# PostGIS Initialization Script
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgis-init
  namespace: map-service
data:
  01-init-extensions.sql: |
    -- Enable PostGIS extensions
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS postgis_topology;
    CREATE EXTENSION IF NOT EXISTS postgis_raster;
    CREATE EXTENSION IF NOT EXISTS pgrouting;
    CREATE EXTENSION IF NOT EXISTS hstore;
    
    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE geodb TO le;
    GRANT ALL ON SCHEMA public TO le;

---
# ============================================================================
# Martin Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: martin-config
  namespace: map-service
data:
  config.yml: |
    # Martin tile server configuration
    keep_alive: 75
    listen_addresses: '0.0.0.0:3000'
    base_path: /
    worker_processes: 8
    cache_size_mb: 1024
    preferred_encoding: gzip
    web_ui: enable-for-all
    observability:
      metrics:
        add_labels: {}

    cors: 
      origin: 
        - "*"
      max_age: 3600
    
    # PostgreSQL dynamic tiles from PostGIS
    postgres:
      connection_string: "postgresql://le:123456@postgis-service:5432/geodb?sslmode=disable"
      default_srid: 4326
      auto_publish:
        tables:
          from_schemas:
            - topology
          source_id_format: '{schema}.{table}'
          id_columns: id
          clip_geom: true
          buffer: 64
          extent: 4096
    
    # PMTiles support (Scenario 2 & 3)
    pmtiles:
      directory_cache_size_mb: 128
      allow_http: true
      paths:
      - /pmtiles
    
    # MBTiles support (Scenario 2)
    mbtiles:
      paths:
        # - /mbtiles
    
    # Sprites
    sprites:
      cache_size_mb: 64
      paths:
      # - /sprites
      sources:
    
    # Fonts
    fonts:
      cache_size_mb: 64
      paths:
      # - /fonts

    # Styles
    styles:
      paths:
      - /styles

    tilejson_url_version_param: null
---
# ============================================================================
# Tileserver Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tileserver-config
  namespace: map-service
data:
  config.json: |
    {
      "options": {
        "paths": {
          "root": "/tileserver",
          "styles": "styles",
          "fonts": "fonts",
          "sprites": "sprites",
          "mbtiles": "/data/mbtiles"
        },
        "domains": [
          "tileserver.172-17-65-26.sslip.io",
          "map.172-17-65-26.sslip.io"
        ],
        "formatQuality": {
          "jpeg": 80,
          "webp": 90
        },
        "maxScaleFactor": 3,
        "maxSize": 2048,
        "pbfAlias": "pbf",
        "serveAllFonts": true,
        "serveAllStyles": false,
        "serveStaticMaps": true,
        "staticAttributionText": "© OpenMapTiles © OpenStreetMap contributors"
      },
      "styles": {
        "basic-style": {
          "style": "style.json",
          "tilejson": {
            "type": "overlay",
            "bounds": [-180, -85.0511, 180, 85.0511]
          }
        },
        "sat-style": {
          "style": "style_sat.json",
          "tilejson": {
            "type": "overlay",
            "bounds": [-180, -85.0511, 180, 85.0511]
          }
        },
        "3d-style": {
          "style": "style_3d.json",
          "tilejson": {
            "type": "overlay",
            "bounds": [-180, -85.0511, 180, 85.0511]
          }
        }
      },
      "data": {
        "Administrative": {
          "mbtiles": "Administrative.mbtiles"
        },
        "City_District_Zone": {
          "mbtiles": "City_District_Zone.mbtiles"
        },
        "address_layer": {
          "mbtiles": "address_layer.mbtiles"
        },
        "street_centerline": {
          "mbtiles": "street_centerline.mbtiles"
        },
        "riyadh": {
          "mbtiles": "riyadh.mbtiles"
        }
      }
    }

---
# ============================================================================
# Frontend Nginx Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: map-service
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Enable CORS for all requests
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin * always;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

---
# ============================================================================
# SECTION 2: STORAGE
# Persistent Volumes for PostGIS + ES + Kibana
# ============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-data-pvc
  namespace: map-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: local-path  # K3s default

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-data-pvc
  namespace: map-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  # storageClassName: local-path   # uncomment if needed (K3s default)

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kibana-data-pvc
  namespace: map-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: local-path

---
# ============================================================================
# SECTION 3: DEPLOYMENTS
# ============================================================================

# ============================================================================
# PostGIS Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis
  namespace: map-service
  labels:
    app: postgis
spec:
  replicas: 1
  strategy:
    type: Recreate  # For database with persistent volume
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
      - name: postgis
        image: pgrouting/pgrouting:16-3.5-4.0
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: map-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgis-data
          mountPath: /var/lib/postgresql/data
        - name: data-import
          mountPath: /data
        - name: postgis-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        readinessProbe:
          exec:
            command: 
              - /bin/sh
              - -c
              - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postgis-data
        persistentVolumeClaim:
          claimName: postgis-data-pvc
      - name: data-import
        hostPath:
          path: /mnt/d/Git/mapserver/data  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: postgis-init
        configMap:
          name: postgis-init

---
# ============================================================================
# Martin Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
  namespace: map-service
  labels:
    app: martin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: martin
  template:
    metadata:
      labels:
        app: martin
    spec:
      containers:
      - name: martin
        image: ghcr.io/maplibre/martin:1.4.0
        ports:
        - containerPort: 3000
          name: http
        command: ["martin", "--config", "/config.yml"]
        volumeMounts:
        - name: martin-config
          mountPath: /config.yml
          subPath: config.yml
        - name: mbtiles
          mountPath: /mbtiles
          readOnly: true
        - name: pmtiles
          mountPath: /pmtiles
          readOnly: true
        - name: fonts
          mountPath: /fonts
          readOnly: true
        - name: sprites
          mountPath: /sprites
          readOnly: true
        - name: styles
          mountPath: /styles
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: martin-config
        configMap:
          name: martin-config
      - name: mbtiles
        hostPath:
          path: /mnt/d/Git/mapserver/data/mbtiles  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: pmtiles
        hostPath:
          path: /mnt/d/Git/mapserver/data/pmtiles  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: fonts
        hostPath:
          path: /mnt/d/Git/mapserver/data/fonts  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: sprites
        hostPath:
          path: /mnt/d/Git/mapserver/data/sprites  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: styles
        hostPath:
          path: /mnt/d/Git/mapserver/styles_k3s/martin  # UPDATE THIS PATH
          type: DirectoryOrCreate

---
# ============================================================================
# Elasticsearch Deployment (single node)
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: map-service
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
        ports:
        - containerPort: 9200
          name: http
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms4g -Xmx4g"
        - name: "bootstrap.memory_lock"
          value: "true"
        - name: logger.org.elasticsearch
          value: "WARN"
        - name: http.cors.enabled
          value: "true"
        - name: http.cors.allow-origin
          value: '["*"]'
        - name: http.cors.allow-methods
          value: "OPTIONS,HEAD,GET,POST,PUT,DELETE"
        - name: http.cors.allow-headers
          value: "X-Requested-With,Content-Type,Content-Length,Authorization"
        - name: http.cors.allow-credentials
          value: "true"
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
          limits:
            memory: "8Gi"
            cpu: "1500m"
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - 'curl -s -f http://localhost:9200/_cat/health?h=status | grep -q green'
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30   # give it time to start
        livenessProbe:
          httpGet:
            path: /_cat/health?h=status
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: es-data-pvc

---

# ============================================================================
# Kibana Deployment
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: map-service
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:9.3.1
        ports:
        - containerPort: 5601
          name: http
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        - name: SERVER_PUBLICBASEURL
          value: "http://kibana.172-17-65-26.sslip.io"   # helps with some proxy / iframe issues
        volumeMounts:
        - name: kibana-data
          mountPath: /usr/share/kibana/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "800m"
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 10
      volumes:
      - name: kibana-data
        persistentVolumeClaim:
          claimName: kibana-data-pvc

---
# ============================================================================
# Tileserver Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver
  namespace: map-service
  labels:
    app: tileserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tileserver
  template:
    metadata:
      labels:
        app: tileserver
    spec:
      containers:
      - name: tileserver
        image: maptiler/tileserver-gl:latest
        ports:
        - containerPort: 8080
          name: http
        args:
          - --config
          - /tileserver/config.json
          - --verbose
        volumeMounts:
        - name: tileserver-config
          mountPath: /tileserver/config.json
          subPath: config.json
        - name: styles
          mountPath: /tileserver/styles
          readOnly: true
        - name: fonts
          mountPath: /tileserver/fonts
          readOnly: true
        - name: sprites
          mountPath: /tileserver/sprites
          readOnly: true
        - name: mbtiles
          mountPath: /data/mbtiles
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: tileserver-config
        configMap:
          name: tileserver-config
      - name: styles
        hostPath:
          path: /mnt/d/Git/mapserver/styles_k3s/tileserver  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: fonts
        hostPath:
          path: /mnt/d/Git/mapserver/data/fonts  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: sprites
        hostPath:
          path: /mnt/d/Git/mapserver/data/sprites  # UPDATE THIS PATH
          type: DirectoryOrCreate
      - name: mbtiles
        hostPath:
          path: /mnt/d/Git/mapserver/data/mbtiles  # UPDATE THIS PATH
          type: DirectoryOrCreate

---
# ============================================================================
# Routing API Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-api
  namespace: map-service
  labels:
    app: routing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routing-api
  template:
    metadata:
      labels:
        app: routing-api
    spec:
      containers:
      - name: routing-api
        image: python:3.12-slim
        ports:
        - containerPort: 5000
          name: http
        command:
        - sh
        - -c
        - "pip install --no-cache-dir -r requirements.txt && python app.py"
        workingDir: /app
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: map-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: POSTGRES_PORT
        volumeMounts:
        - name: routing-api-code
          mountPath: /app
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: routing-api-code
        hostPath:
          path: /mnt/d/Git/mapserver/routing-api  # UPDATE THIS PATH
          type: Directory

---
# ============================================================================
# PgAdmin Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: map-service
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          valueFrom:
            configMapKeyRef:
              name: map-env-config
              key: PGADMIN_DEFAULT_EMAIL
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: map-secrets
              key: PGADMIN_DEFAULT_PASSWORD
        - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
          value: "False"
        - name: PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT
          value: "False"
        - name: PGADMIN_CONFIG_WTF_CSRF_TIME_LIMIT
          value: "None"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        readinessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

---
# ============================================================================
# Frontend Deployment - PROPER FIX with Init Container
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: map-service
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:  #init container to copy your frontend files to a shared volume, then mount the data directories
      - name: copy-frontend
        image: busybox:latest
        command: ['sh', '-c', 'cp -r /source/* /target/ || true']
        volumeMounts:
        - name: frontend-source
          mountPath: /source
          readOnly: true
        - name: html-volume
          mountPath: /target
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: html-volume
          mountPath: /usr/share/nginx/html
        - name: pmtiles
          mountPath: /usr/share/nginx/html/pmtiles
          readOnly: true
        - name: sprites
          mountPath: /usr/share/nginx/html/sprites
          readOnly: true
        - name: fonts
          mountPath: /usr/share/nginx/html/fonts
          readOnly: true
        - name: styles
          mountPath: /usr/share/nginx/html/styles
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: frontend-source
        hostPath:
          path: /mnt/d/Git/mapserver/frontend_k3s
          type: Directory
      - name: html-volume
        emptyDir: {}
      - name: pmtiles
        hostPath:
          path: /mnt/d/Git/mapserver/data/pmtiles
          type: DirectoryOrCreate
      - name: sprites
        hostPath:
          path: /mnt/d/Git/mapserver/data/sprites
          type: DirectoryOrCreate
      - name: fonts
        hostPath:
          path: /mnt/d/Git/mapserver/data/fonts
          type: DirectoryOrCreate
      - name: styles
        hostPath:
          path: /mnt/d/Git/mapserver/styles_k3s
          type: DirectoryOrCreate    
      - name: nginx-config
        configMap:
          name: frontend-nginx-config

---


# ============================================================================
# SECTION 4: SERVICES
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: postgis-service
  namespace: map-service
  labels:
    app: postgis
spec:
  selector:
    app: postgis
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: martin-service
  namespace: map-service
  labels:
    app: martin
spec:
  selector:
    app: martin
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP

---
