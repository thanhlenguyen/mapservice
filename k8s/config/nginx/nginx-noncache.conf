server {
    listen 80;
    server_name map-tiles-frontend.address.gov.sa localhost;

    root /usr/share/nginx/html;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- ADDED: Global CORS + Preflight handling (minimal) ---
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }
    # --- END ADDED ---

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_static on;
    gzip_disable msie6;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml
        application/x-protobuf
        application/vnd.mapbox-vector-tile
        application/wasm
        application/vnd.geo+json
        application/octet-stream;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- ADDED: API reverse proxy ---
    # Nginx config
    location /api/ {
        proxy_pass http://map-tiles-routing-api-dev.external-layer.svc/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- END ADDED ---

    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # Elasticsearch Proxy (secured + CORS)
    # =========================
    location /es/ {
        # Handle preflight OPTIONS request (CORS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://map-tiles-frontend.address.gov.sa' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        # Forward to Elasticsearch with Basic Auth
        proxy_pass https://non-prd-elastic-mapservice.address.gov.sa/;

        # Important headers for Elasticsearch
        proxy_http_version 1.1;
        proxy_set_header Host              non-prd-elastic-mapservice.address.gov.sa;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Inject Basic Authentication (credentials stay server-side)
        proxy_set_header Authorization "Basic ZWxhc3RpYzoyOTBYcUhYRTc0YjVKWVQ2NzNQR1dvNWI=";   # Base64 of "elastic:290Xq"

        # CORS response headers for actual requests
        add_header 'Access-Control-Allow-Origin' 'https://map-tiles-frontend.address.gov.sa' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Do not cache search requests
        proxy_cache off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Timeouts (adjust if needed)
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---- STATIC: cache OFF ----
    location ~* \.(?:css|js)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|mp3|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(?:json)$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /data/ {
        rewrite ^/data/(.*)$ /tiles/data/$1 break;
    }

    location ^~ /css/ {
        alias /mapservice/frontend/css/;

        access_log off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        try_files $uri =404;
    }

    location ^~ /js/ {
        alias /mapservice/frontend/js/;

        access_log off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        try_files $uri =404;
    }

    # ---- TILESERVER: proxy cache OFF + client cache OFF ----
    location /tiles/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://map-tiles-tileserver-dev:80;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        send_timeout 30s;

        proxy_cache off;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    }

    # Serve PMTiles directly from GCS bucket - CACHE OFF
    location ^~ /pmtiles/ {
        alias /mapservice/data/pmtiles/;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        add_header Accept-Ranges bytes;
    }

    # Serve sprites from GCS bucket - CACHE OFF
    location ^~ /sprites/ {
        alias /mapservice/tileserver/sprites/;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
    }

    # Serve fonts from GCS bucket - CACHE OFF
    location ^~ /fonts/ {
        alias /mapservice/tileserver/fonts/;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
    }

    # Serve styles from GCS bucket - CACHE OFF
    location ^~ /styles/ {
        alias /mapservice/tileserver/styles/;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
    }

    # Serve frontend styles from GCS bucket - CACHE OFF
    location ^~ /pm_styles/ {
        alias /mapservice/frontend/pm_styles/;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
    }

    # ---- MARTIN: proxy cache OFF + client cache OFF ----
    location /martin/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://map-tiles-martin-dev:80/;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        send_timeout 30s;

        proxy_cache off;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}