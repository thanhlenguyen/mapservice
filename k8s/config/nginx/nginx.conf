server {
    listen 80;
    server_name map-tiles-frontend.address.gov.sa localhost;

    root /usr/share/nginx/html;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_static on;
    gzip_disable msie6;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml
        application/x-protobuf
        application/vnd.mapbox-vector-tile
        application/wasm
        application/vnd.geo+json
        application/octet-stream;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|mp3|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
        expires max;
        access_log off;
        add_header Cache-Control "public";
    }


    # =========================
    # Static assets from bucket
    # IMPORTANT: use ^~ so regex locations won't steal requests (e.g. *.json)
    # =========================

    # Serve PMTiles directly from GCS bucket
    location ^~ /pmtiles/ {
        alias /mapservice/data/pmtiles/;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        # Enable range requests for PMTiles HTTP protocol
        add_header Accept-Ranges bytes;
    }

    # Serve sprites from GCS bucket
    location ^~ /sprites/ {
        alias /mapservice/tileserver/sprites/;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Serve fonts from GCS bucket
    location ^~ /fonts/ {
        alias /mapservice/tileserver/fonts/;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Serve styles from GCS bucket
    location ^~ /styles/ {
        alias /mapservice/tileserver/styles/;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Serve frontend styles from GCS bucket
    location ^~ /pm_styles/ {
        alias /mapservice/frontend/pm_styles/;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # =========================
    # Proxies (cached)
    # =========================

    location /tiles/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://map-tiles-tileserver-dev:80;

        proxy_cache tiles_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key "$scheme$host$request_uri" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering on;
        proxy_request_buffering on;

        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
    }

    location /martin/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://map-tiles-martin-dev:80/;

        proxy_cache tiles_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 300s;
        proxy_cache_valid 404 30s;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 10s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key "$scheme$host$request_uri" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering on;
        proxy_request_buffering on;

        expires 300s;
        add_header Cache-Control "public, max-age=300" always;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
    }

    # =========================
    # Elasticsearch Secure Proxy (Search - NO CACHE)
    # =========================
    location /es/ {
        # CORS Preflight (OPTIONS) handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      'https://map-tiles-frontend.address.gov.sa' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        # Proxy to Elasticsearch
        proxy_pass https://non-prd-elastic-mapservice.address.gov.sa/;

        proxy_http_version 1.1;
        proxy_set_header Host              non-prd-elastic-mapservice.address.gov.sa;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Basic Auth (credentials stay on server - Base64 of elastic:290Xq)
        proxy_set_header Authorization "Basic ZWxhc3RpYzoyOTBYcUhYRTc0YjVKWVQ2NzNQR1dvNWI=";

        # CORS for actual requests
        add_header 'Access-Control-Allow-Origin'      'https://map-tiles-frontend.address.gov.sa' always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # === CRITICAL: DISABLE CACHE for search ===
        proxy_cache off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}